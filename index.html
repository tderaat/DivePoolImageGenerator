<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FS4 Dive Pool Image Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1>FS4 Dive Pool Image Generator</h1>
      <button id="theme-toggle" type="button" aria-label="Toggle dark theme" title="Toggle dark theme">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 3 a9 9 0 0 1 0 18 z" fill="currentColor" stroke="none"></path>
        </svg>
      </button>
    </div>
    <p class="hint">
      Paste jumps, one per line. Separate elements with spaces or dashes.
    </p>
  </header>

  <section class="input-panel">
    <div class="textareas">
      <div class="textarea-col">
        <label class="textarea-label" for="jumps-input">Jumps</label>
        <textarea id="jumps-input" rows="5" spellcheck="false">21 M F</textarea>
      </div>
      <div class="textarea-divider"></div>
      <div class="textarea-col">
        <label class="textarea-label" for="ignore-input">Ignore</label>
        <textarea id="ignore-input" rows="5" spellcheck="false" placeholder="e.g. 6 A 12"></textarea>
      </div>
    </div>
    <div class="actions">
      <button id="clear-btn" type="button">Clear</button>
      <button id="random-btn" type="button" title="Generate 8 random jumps using FAI AAA dive pool rules">Random</button>
      <button id="print-btn" type="button">PDF</button>
      <div class="color-pickers">
        <label><span>Point</span><input type="color" id="color-point" value="#d23a28"></label>
        <label><span>Tail</span><input type="color" id="color-tail" value="#f0cd2a"></label>
        <label><span>Inside</span><input type="color" id="color-inside" value="#3182ce"></label>
        <label><span>Outside</span><input type="color" id="color-outside" value="#4aa04a"></label>
        <button id="reset-colors-btn" type="button">Reset</button>
      </div>
    </div>
  </section>

  <section id="results"></section>

  <script src="script.js"></script>
</body>
</html>
